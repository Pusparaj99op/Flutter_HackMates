name: ecoquest_carbon_tracker
description: AR Carbon Footprint Tracker with Gamification
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_database: ^10.4.0
  firebase_storage: ^11.5.6
  google_sign_in: ^6.1.6
  
  # UI & State Management
  provider: ^6.1.1
  cupertino_icons: ^1.0.2
  
  # Utilities
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  
  # Camera & ML
  camera: ^0.10.5+7
  google_mlkit_object_detection: ^0.10.0
  google_mlkit_image_labeling: ^0.9.0
  
  # Location
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  
  # Charts
  fl_chart: ^0.66.0
  
  # Animations
  lottie: ^2.7.0
  
  # Image handling
  image_picker: ^1.0.7
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/lottie/
    - assets/images/
    - assets/icons/
