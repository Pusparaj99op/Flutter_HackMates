name: hackmate
description: Campus Skill & Hackathon Hub - A Flutter app for connecting students with hackathons and skill development.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  provider: ^6.1.1
  go_router: ^14.0.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  intl: ^0.20.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.2
  flutter_local_notifications: ^17.0.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
